[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imprint-cli"
version = "3.0.0"
description = "Stamp your developer environment on any machine — snapshot, restore, diff, encrypt."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "KaizenCode21" },
]
maintainers = [
    { name = "Venkatesh-6921" },
]
keywords = [
    "dotfiles", "developer", "environment", "portable",
    "devtools", "cli", "snapshot", "restore", "backup",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1.7",
    "rich>=13.9.0",
    "gitpython>=3.1.43",
    "tomli_w>=1.1.0",
    "platformdirs>=4.2.0",
    "pyyaml>=6.0.2",
    "textual>=0.61.0",
]

[project.optional-dependencies]
crypto = [
    "cryptography>=42.0.0",
]
watch = [
    "watchdog>=6.0.0",
]
full = [
    "cryptography>=42.0.0",
    "watchdog>=6.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "cryptography>=42.0.0",
    "watchdog>=6.0.0",
]

[project.scripts]
imp     = "imprint.cli:main"
imprint = "imprint.cli:main"

[project.urls]
Homepage      = "https://github.com/Venkatesh-6921/imprint-cli"
Repository    = "https://github.com/Venkatesh-6921/imprint-cli"
"Bug Tracker" = "https://github.com/Venkatesh-6921/imprint-cli/issues"
Changelog     = "https://github.com/Venkatesh-6921/imprint-cli/blob/main/CHANGELOG.md"

[tool.ruff]
target-version = "py311"
line-length    = 100
exclude        = ["install_cli.py", "imprint-cli-v2"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N818"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["imprint"]

[tool.hatch.version]
path = "imprint/__init__.py"
